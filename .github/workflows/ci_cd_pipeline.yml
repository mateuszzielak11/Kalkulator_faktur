name: Invoice Calculator CI/CD with Service Principal

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 1. Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: 2. Konfiguracja Python 3.11 (z cache zależności)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Analiza statyczna kodu (Linter - NFR3)
        run: ruff check .

      - name: 5. Uruchomienie testów jednostkowych (Pytest - FR1, FR2, NFR3)
        run: pytest -v

    - name: 6. Uruchomienie kalkulatora z poświadczeniami Service Principal (NFR1)
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python main.py
